name: Django CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test-and-lint:
    runs-on: ubuntu-latest
    env:
      SECRET_KEY: django-ci-test-key
      DEBUG: "False"
      DATABASE_URL: postgres://postgres:postgres@localhost:5432/djangomart
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: djangomart
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d djangomart"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-dev.txt
      - name: Install dependencies
        run: python -m pip install -r requirements-dev.txt
      - name: Run Django checks
        run: python manage.py check
      - name: Run tests
        run: python manage.py test
      - name: Run Ruff
        run: python -m ruff check .
